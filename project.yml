name: MashupStudio
options:
  bundleIdPrefix: com.seanyehezkel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MashupStudio:
    type: application
    platform: iOS
    sources:
      - App/Sources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "סטודיו מיקס"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    configFiles:
      Debug: Configs/ThirdParty.xcconfig
      Release: Configs/ThirdParty.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seanyehezkel.mashupstudio
        INFOPLIST_KEY_CFBundleDisplayName: "סטודיו מיקס"
  MashupStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
    dependencies:
      - target: MashupStudio
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MashupStudio.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)MashupStudio"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MashupStudio:
    build:
      targets:
        MashupStudio: all
        MashupStudioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MashupStudioTests
    archive:
      config: Release
